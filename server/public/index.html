<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Mirror</title>
<style>
html,body{height:100%;margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
#gate{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
h1{font-size:34px;font-weight:600;letter-spacing:-.02em;margin:0}
p{color:#8a8a8f;margin:0 0 18px}
input{width:300px;max-width:80vw;box-sizing:border-box;background:#0c0c0e;border:1px solid #26262a;color:#fff;border-radius:16px;padding:18px;font-size:28px;text-align:center;letter-spacing:.3em;outline:none}
button{font:inherit;cursor:pointer}
#go{width:300px;max-width:80vw;font-size:17px;font-weight:600;padding:18px;border-radius:16px;border:0;background:#fff;color:#000}
#msg{color:#8a8a8f;min-height:22px}
#stage{display:none;height:100%;flex-direction:column;align-items:center}
#cwrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
canvas{max-width:100%;max-height:100%;touch-action:none;background:#000;cursor:pointer}
#bar{display:flex;gap:10px;padding:10px;width:100%;box-sizing:border-box;justify-content:center}
#bar button{flex:1;max-width:140px;padding:12px;font-size:15px;border-radius:14px;background:#0c0c0e;color:#fff;border:1px solid #26262a}
#bar button:active{background:#1c1c20}
</style></head><body>
<div id="gate">
  <h1>Mirror</h1>
  <p>Enter the code shown on your phone</p>
  <input id="code" inputmode="numeric" maxlength="7" placeholder="000 000" autocomplete="off">
  <button id="go">Connect</button>
  <div id="msg"></div>
</div>
<div id="stage">
  <div id="cwrap"><canvas id="c"></canvas></div>
  <div id="bar">
    <button data-k="back">Back</button>
    <button data-k="home">Home</button>
    <button data-k="recents">Recents</button>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const c = $('c'), ctx = c.getContext('2d');
let ws, decoding = false, live = false, latest = null;

function fail(t){ live = false; $('msg').textContent = t; $('gate').style.display = 'flex'; $('stage').style.display = 'none'; }

// Always draw the newest frame; never drop the last one while a decode is running.
let dec = null, gotKey = false, frameOut = null, raf = 0;
function resetDec(){ try{ dec && dec.close(); }catch(e){} dec = null; gotKey = false; if (frameOut){ try{ frameOut.close(); }catch(e){} frameOut = null; } }
function needKey(){ gotKey = false; if (ws && ws.readyState === 1) ws.send('{"t":"need-key"}'); }
function draw(){
  raf = 0; const f = frameOut; if (!f) return; frameOut = null;
  const fw = f.displayWidth, fh = f.displayHeight;
  if (c.width !== fw || c.height !== fh) { c.width = fw; c.height = fh; }
  ctx.drawImage(f, 0, 0); f.close();
  if (!live) { live = true; $('gate').style.display = 'none'; $('stage').style.display = 'flex'; }
}
function spsCodec(u){
  for (let i = 0; i + 4 < u.length; i++){
    if (u[i] === 0 && u[i+1] === 0 && (u[i+2] === 1 || (u[i+2] === 0 && u[i+3] === 1))){
      const s = i + (u[i+2] === 1 ? 3 : 4);
      if ((u[s] & 31) === 7 && s + 3 < u.length){
        const hx = n => n.toString(16).padStart(2, '0');
        return 'avc1.' + hx(u[s+1]) + hx(u[s+2]) + hx(u[s+3]);
      }
    }
  }
  return null;
}
function onFrame(buf){
  if (typeof VideoDecoder === 'undefined'){ fail('This browser cannot decode video. Use Chrome or Edge.'); return; }
  const u = new Uint8Array(buf); if (u.length < 6) return;
  const key = u[0] === 1, p = u.subarray(1);
  if (!dec || dec.state === 'closed'){
    if (!key) return;
    const codec = spsCodec(p); if (!codec) return;
    dec = new VideoDecoder({
      output: f => { if (frameOut) frameOut.close(); frameOut = f; if (!raf) raf = requestAnimationFrame(draw); },
      error: () => { resetDec(); needKey(); }
    });
    dec.configure({ codec: codec, optimizeForLatency: true, avc: { format: 'annexb' } });
    gotKey = true;
  }
  if (!gotKey){ if (!key) return; gotKey = true; }
  if (dec.decodeQueueSize > 4 && !key){ needKey(); return; }
  try { dec.decode(new EncodedVideoChunk({ type: key ? 'key' : 'delta', timestamp: Math.round(performance.now() * 1000), data: p })); }
  catch (e) { resetDec(); needKey(); }
}

function go(){
  const code = $('code').value.replace(/\D/g, '');
  if (code.length !== 6) { $('msg').textContent = 'Code must be 6 digits.'; return; }
  $('msg').textContent = 'Connecting…';
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/?role=viewer&code=' + code);
  ws.binaryType = 'arraybuffer'; resetDec(); live = false;
  ws.onmessage = e => {
    if (typeof e.data === 'string') {
      const m = JSON.parse(e.data);
      if (m.type === 'error') fail(m.message);
      else if (m.type === 'host-left') fail('Phone disconnected.');
      return;
    }
    onFrame(e.data);
  };
  ws.onclose = () => { if (live) fail('Disconnected.'); };
}

function send(t, e){
  if (!ws || ws.readyState !== 1) return;
  const r = c.getBoundingClientRect();
  ws.send(JSON.stringify({ t, x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height, ts: performance.now() }));
}
c.addEventListener('pointerdown', e => { c.setPointerCapture(e.pointerId); send('down', e); });
c.addEventListener('pointermove', e => { if (e.buttons) send('move', e); });
c.addEventListener('pointerup', e => send('up', e));

document.querySelectorAll('#bar button').forEach(b => b.onclick = () => {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'key', k: b.dataset.k }));
});

$('go').onclick = go;
$('code').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
</script></body></html>
